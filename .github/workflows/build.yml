name: Build installers
on: { push: { branches: [master, main] }, workflow_dispatch: {} }
# Installers ship as RELEASE ASSETS, not workflow artifacts — the artifact storage quota
# filled up Sep 14 (every 0.9.x upload counted against it even at 2-day retention) and both
# jobs started failing at the upload step with the builds themselves green.
permissions: { contents: write }
jobs:
  win:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci || npm install
      # Bundle mpv (playback engine) — plain x86_64 build (v3 needs newer CPUs; arm64
      # Windows runs the x64 exe fine under emulation)
      - name: Bundle mpv
        shell: pwsh
        run: |
          # authenticated — anonymous API calls from shared runner IPs get rate-limited
          $rel = Invoke-RestMethod https://api.github.com/repos/shinchiro/mpv-winbuild-cmake/releases/latest -Headers @{Authorization="Bearer ${{ secrets.GITHUB_TOKEN }}"}
          $asset = $rel.assets | Where-Object { $_.name -match '^mpv-x86_64-[0-9].*\.7z$' } | Select-Object -First 1
          Invoke-WebRequest $asset.browser_download_url -OutFile mpv.7z
          7z x mpv.7z -ompvtmp | Out-Null
          New-Item -ItemType Directory -Force mpv/win | Out-Null
          Copy-Item mpvtmp/mpv.exe mpv/win/mpv.exe
          Invoke-WebRequest https://curl.se/ca/cacert.pem -OutFile mpv/win/cacert.pem
          Remove-Item -Recurse -Force mpvtmp, mpv.7z
      # ONE installer with x64 + arm64 inside — it auto-installs the right one
      - run: npx electron-builder --win nsis --x64 --arm64 --publish never
      - name: Upload to release
        shell: bash
        env: { GH_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }
        run: |
          V=$(node -p "require('./package.json').version")
          gh release create "v$V" --title "v$V" --notes "auto-build" || true
          gh release upload "v$V" dist/*.exe dist/latest.yml --clobber
  mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci || npm install
      # Bundle mpv.app for BOTH arches (the electron app is universal; mpv is per-arch,
      # main.js picks mpv/mac-<arch>/mpv.app at runtime)
      - name: Bundle mpv
        run: |
          for arch in arm64 x86_64; do
            # authenticated — anonymous API calls from shared runner IPs get rate-limited
            url=$(curl -s -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
              https://api.github.com/repos/eko5624/mpv-mac/releases/latest \
              | jq -r ".assets[] | select(.name | startswith(\"mpv-$arch\")) | .browser_download_url")
            curl -sL "$url" -o mpv-$arch.zip
            mkdir -p mpv/mac-$arch
            unzip -q mpv-$arch.zip -d mpvtmp-$arch
            mv mpvtmp-$arch/mpv/mpv.app mpv/mac-$arch/mpv.app
            chmod +x mpv/mac-$arch/mpv.app/Contents/MacOS/mpv
            # ad-hoc sign the whole nested app — macOS (esp. Apple Silicon) SIGKILLs
            # unsigned helper binaries on spawn: the "flash for 0.01s then nothing" bug
            codesign --force --deep --sign - mpv/mac-$arch/mpv.app
            # CA bundle: the portable mpv has NO trusted roots — every https stream failed
            # "certificate verify failed" (the entire Mac playback saga, solved Sep 13)
            curl -sL https://curl.se/ca/cacert.pem -o mpv/mac-$arch/cacert.pem
            rm -rf mpvtmp-$arch mpv-$arch.zip
          done
      - run: npx electron-builder --mac dmg --universal --publish never
      - name: Upload to release
        env: { GH_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }
        run: |
          V=$(node -p "require('./package.json').version")
          gh release create "v$V" --title "v$V" --notes "auto-build" || true
          gh release upload "v$V" dist/*.dmg --clobber
